# LGTM Skill Configuration
# Place this file at: ~/.config/lgtm/config.yaml
#
# This format is compatible with lgtm-mcp for easy migration.

version: "1"

# Default instance to use when none specified
default_instance: "local"

instances:
  # Local development instance (no authentication)
  local:
    loki:
      url: "http://localhost:3100"
    prometheus:
      url: "http://localhost:9090"
    tempo:
      url: "http://localhost:3200"

  # Grafana Cloud example (uses basic auth with API key)
  # grafana-cloud:
  #   loki:
  #     url: "https://logs-prod-us-central1.grafana.net"
  #     username: "${GRAFANA_CLOUD_USER}"    # Your Grafana Cloud user ID
  #     token: "${GRAFANA_CLOUD_API_KEY}"    # API key from Grafana Cloud
  #   prometheus:
  #     url: "https://prometheus-prod-us-central1.grafana.net/api/prom"
  #     username: "${GRAFANA_CLOUD_USER}"
  #     token: "${GRAFANA_CLOUD_API_KEY}"
  #   tempo:
  #     url: "https://tempo-prod-us-central1.grafana.net"
  #     username: "${GRAFANA_CLOUD_USER}"
  #     token: "${GRAFANA_CLOUD_API_KEY}"

  # Production example with bearer token auth
  # production:
  #   loki:
  #     url: "https://loki.internal.example.com"
  #     token: "${PROD_LOKI_TOKEN}"          # Bearer token
  #   prometheus:
  #     url: "https://mimir.internal.example.com"
  #     token: "${PROD_MIMIR_TOKEN}"
  #   tempo:
  #     url: "https://tempo.internal.example.com"
  #     token: "${PROD_TEMPO_TOKEN}"

  # Multi-tenant example with custom headers
  # multi-tenant:
  #   loki:
  #     url: "https://loki.shared.example.com"
  #     token: "${SHARED_TOKEN}"
  #     headers:
  #       X-Scope-OrgID: "team-platform"     # Tenant identifier
  #   prometheus:
  #     url: "https://mimir.shared.example.com"
  #     token: "${SHARED_TOKEN}"
  #     headers:
  #       X-Scope-OrgID: "team-platform"
  #   tempo:
  #     url: "https://tempo.shared.example.com"
  #     token: "${SHARED_TOKEN}"
  #     headers:
  #       X-Scope-OrgID: "team-platform"

  # AWS-hosted example with region-specific endpoints
  # aws-prod:
  #   loki:
  #     url: "https://loki.us-east-1.example.com"
  #     token: "${AWS_LOKI_TOKEN}"
  #     headers:
  #       X-AWS-Region: "us-east-1"
  #   prometheus:
  #     url: "https://aps.us-east-1.amazonaws.com/workspaces/ws-xxx"
  #     # AWS SigV4 auth handled externally (e.g., via aws-vault)
  #   tempo:
  #     url: "https://tempo.us-east-1.example.com"
  #     token: "${AWS_TEMPO_TOKEN}"

  # ============================================================================
  # Kubernetes Port-Forward Examples
  # ============================================================================
  # For services running inside Kubernetes clusters that are not exposed
  # externally, use port-forwarding to access them locally.
  #
  # The `portForward` block tells the agent how to establish the tunnel:
  #   - context: Kubernetes context name (from ~/.kube/config)
  #   - namespace: Namespace where the service runs
  #   - service: Service name to forward to
  #   - localPort: Local port to listen on
  #   - remotePort: Service port to forward to
  #
  # Before querying, the agent should run:
  #   kubectl port-forward -n <namespace> svc/<service> <localPort>:<remotePort> --context <context>
  # ============================================================================

  # Kubernetes cluster with Victoria Metrics (port-forward required)
  # sandbox-cluster:
  #   prometheus:
  #     url: "http://localhost:8428"
  #     portForward:
  #       context: "sandbox"                    # kubectl context name
  #       namespace: "monitoring"               # namespace of the service
  #       service: "victoria-metrics-server"    # service name
  #       localPort: 8428                       # local port to bind
  #       remotePort: 8428                      # service port to forward

  # Kubernetes cluster with full LGTM stack (multiple port-forwards)
  # k8s-monitoring:
  #   loki:
  #     url: "http://localhost:3100"
  #     portForward:
  #       context: "production"
  #       namespace: "monitoring"
  #       service: "loki-gateway"
  #       localPort: 3100
  #       remotePort: 80
  #   prometheus:
  #     url: "http://localhost:9090"
  #     portForward:
  #       context: "production"
  #       namespace: "monitoring"
  #       service: "prometheus-server"
  #       localPort: 9090
  #       remotePort: 80
  #   tempo:
  #     url: "http://localhost:3200"
  #     portForward:
  #       context: "production"
  #       namespace: "monitoring"
  #       service: "tempo-query-frontend"
  #       localPort: 3200
  #       remotePort: 3200

  # Multiple clusters example - staging vs production
  # staging-cluster:
  #   prometheus:
  #     url: "http://localhost:9091"           # Use different local port to avoid conflicts
  #     portForward:
  #       context: "staging"
  #       namespace: "monitoring"
  #       service: "prometheus-server"
  #       localPort: 9091
  #       remotePort: 80
  #
  # production-cluster:
  #   prometheus:
  #     url: "http://localhost:9092"
  #     portForward:
  #       context: "production"
  #       namespace: "monitoring"
  #       service: "prometheus-server"
  #       localPort: 9092
  #       remotePort: 80
